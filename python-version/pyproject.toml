[project]
name = "webhook-relay"
version = "0.1.0"
description = "Small webhook relay service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "django>=5.1.0",
    "django-ninja>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.uv]
package = false
